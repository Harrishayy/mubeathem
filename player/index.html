<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo Player</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../panel/panel.css">
<style>
  html, body { height: 100%; }
  body { display: grid; grid-template-columns: minmax(0, 1fr) 440px; height: 100vh; overflow: hidden; }
  .stage { position: relative; display: grid; grid-template-rows: minmax(0, 1fr) auto; background: #000; min-width: 0; }
  video { width: 100%; height: 100%; min-height: 0; object-fit: contain; background: #000; display: block; }
  .deciding { position: absolute; top: 16px; left: 16px; padding: 8px 12px; border-radius: 8px;
              background: rgba(11, 15, 20, .78); border: 1px solid var(--line); font-size: 13px; color: var(--muted);
              opacity: 0; transition: opacity .25s; pointer-events: none; }
  .deciding b { color: var(--accent); font-weight: 600; }
  .deciding.on { opacity: 1; }
  .speed-label { position: absolute; top: 16px; right: 16px; padding: 6px 10px; border-radius: 8px;
                 background: rgba(11, 15, 20, .78); border: 1px solid var(--line); font-size: 13px;
                 color: var(--text); font-variant-numeric: tabular-nums; pointer-events: none; }
  .speed-label[hidden] { display: none; }
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 10px 14px;
              background: var(--surface); border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); }
  .controls select, .controls button { font: inherit; color: var(--text); background: var(--surface-2);
              border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
  .controls label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
  .controls .spacer { flex: 1; }
  aside.panel { overflow-y: auto; border-left: 1px solid var(--line); }
  @media (max-width: 900px) {
    body { grid-template-columns: 1fr; height: auto; overflow: auto; }
    aside.panel { border-left: 0; border-top: 1px solid var(--line); }
  }
</style>
</head>
<body>
<div class="stage">
  <video id="video" controls playsinline muted preload="auto"></video>
  <div class="deciding" id="deciding">Deciding via <b>Mubit</b>…</div>
  <div class="speed-label" id="speed-label">0.5× speed</div>
  <div class="controls">
    <label>Take <select id="take"></select></label>
    <label>Speed <select id="speed">
      <option value="0.25">0.25×</option><option value="0.5" selected>0.5×</option><option value="1">1×</option>
    </select></label>
    <label><input type="checkbox" id="pause" checked> Pause at decisions</label>
    <span class="spacer"></span>
    <button id="restart" type="button">Restart</button>
  </div>
</div>
<aside class="panel" id="panel"></aside>
<script type="module">
import { PANEL_HTML, apply, createState, render } from "../panel/panel.js";

// The simulation was paused while each model call ran, so a take's decisions all sit
// between frames. The player pauses the video there and reveals them one by one.
const HOLD_MS = { attempt: 400, lessons: 600, plan: 1500, safety: 800, hold: 900, escalate: 1500,
                  result: 1600, lesson: 2000 };

// The first check of an attempt gets a full pause; repeat approvals before the pour and
// the return only a beat, so playback doesn't stutter.
function holdFor(event) {
  if (event.kind === "safety" && event.phase !== "approach" && event.label === "supported") return 300;
  return HOLD_MS[event.kind] || 0;
}

const video = document.getElementById("video");
const takeSelect = document.getElementById("take");
const pauseBox = document.getElementById("pause");
const speedSelect = document.getElementById("speed");
const speedLabel = document.getElementById("speed-label");
const deciding = document.getElementById("deciding");
const root = document.getElementById("panel");
root.innerHTML = PANEL_HTML;

let takes = [];
let timeline = [];   // [{ vt, event }] in log order; vt is the event's time in the video
let state = createState();
let next = 0;        // the next timeline entry to reveal
let beat = null;     // set while a cluster of decisions is being revealed
let resumeAfterBeat = false;

const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

function videoTime(t, frames, fps) {
  let lo = 0, hi = frames.length;
  while (lo < hi) {
    const mid = (lo + hi) >> 1;
    if (frames[mid] < t) lo = mid + 1; else hi = mid;
  }
  // The first frame after the event; events after the last frame land just before the
  // video ends, so scrubbing to the end shows them too.
  return Math.min(lo / fps, (frames.length - 1) / fps - 0.15);
}

function resetTo(t) {
  state = createState();
  next = 0;
  while (next < timeline.length && timeline[next].vt <= t) apply(state, timeline[next++].event);
  render(state, root);
}

function cancelBeat() {
  if (beat) beat.cancelled = true;
  beat = null;
  resumeAfterBeat = false;
  deciding.classList.remove("on");
}

async function reveal(upTo) {
  const mine = beat = { cancelled: false };
  if (pauseBox.checked && !video.paused) {
    resumeAfterBeat = true;
    video.pause();
    deciding.classList.add("on");
  }
  while (next < timeline.length && timeline[next].vt <= upTo + 1e-3) {
    const { event } = timeline[next++];
    const changed = apply(state, event);
    if (changed.size) render(state, root, changed);
    const ms = resumeAfterBeat ? holdFor(event) : 0;
    if (ms) await sleep(ms);
    if (mine.cancelled) return;
  }
  beat = null;
  deciding.classList.remove("on");
  if (resumeAfterBeat) {
    resumeAfterBeat = false;
    video.play();
  }
}

function tick() {
  if (!beat && !video.seeking && next < timeline.length && timeline[next].vt <= video.currentTime + 1e-3) {
    reveal(video.currentTime);
  }
  requestAnimationFrame(tick);
}

video.addEventListener("seeking", () => { cancelBeat(); resetTo(video.currentTime); });
video.addEventListener("ended", () => { if (!beat) reveal(Infinity); });
video.addEventListener("play", () => {
  // Pressing play during a pause at a decision skips the rest of that pause.
  if (beat && resumeAfterBeat) { resumeAfterBeat = false; deciding.classList.remove("on"); }
});

async function loadTake(meta) {
  cancelBeat();
  const [log, framesFile] = await Promise.all([
    fetch(meta.log, { cache: "no-store" }).then((r) => r.text()),
    fetch(meta.frames, { cache: "no-store" }).then((r) => r.json()),
  ]);
  const frames = Array.isArray(framesFile) ? framesFile : framesFile.times;
  const events = log.split("\n").filter(Boolean).map((line) => JSON.parse(line));
  timeline = events.map((event) => ({ vt: videoTime(event.t, frames, meta.fps), event }));
  video.src = meta.video;
  video.playbackRate = Number(speedSelect.value);
  resetTo(0);
  history.replaceState(null, "", `?take=${encodeURIComponent(meta.take)}`);
}

async function main() {
  takes = await fetch("../runs/web/takes.json", { cache: "no-store" }).then((r) => r.json());
  takeSelect.innerHTML = takes.map((t) => `<option value="${t.take}">${t.take} · ${t.story}</option>`).join("");
  const wanted = new URLSearchParams(location.search).get("take");
  const first = takes.find((t) => t.take === wanted) || takes.find((t) => t.story === "spills → lands") || takes[0];
  if (!first) return;
  takeSelect.value = first.take;
  await loadTake(first);
  requestAnimationFrame(tick);
}

// Slow motion of the recorded run; the physics itself ran at full speed.
function applySpeed() {
  video.playbackRate = Number(speedSelect.value);
  speedLabel.textContent = `${speedSelect.value}× speed`;
  speedLabel.hidden = speedSelect.value === "1";
}
speedSelect.addEventListener("change", applySpeed);
video.addEventListener("loadedmetadata", applySpeed);

takeSelect.addEventListener("change", () => loadTake(takes.find((t) => t.take === takeSelect.value)));
document.getElementById("restart").addEventListener("click", () => { video.currentTime = 0; video.play(); });
main();
</script>
</body>
</html>
